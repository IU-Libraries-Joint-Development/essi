[supervisord]
nodaemon=true

[program:puma]
directory=/app
command=bundle exec puma -t "2:4" -w "4" --preload -b tcp://0.0.0.0:3000
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:turnstile]
command=/app/turnstile-proxy/bin/turnstile_start
; Restart the proxy if it exits unexpectedly. Without this a dead turnstile leaves
; puma (and thus supervisord) running, so the pod looks healthy while serving nothing.
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
