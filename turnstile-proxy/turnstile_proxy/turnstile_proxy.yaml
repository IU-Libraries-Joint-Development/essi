host: 0.0.0.0
port: 3001

turnstile:
  # WARNING These are the keys publicized by CF for testing; the real ones CANNOT be committed
  # to the repo so we'll have to figure out how to get them from ENV or secrets
  site_key: 1x00000000000000000000AA
  secret_key: 1x0000000000000000000000000000000A

backend: http://0.0.0.0:3000

default_action: pass

rules:
  # Note: set "local: no" on any pattern to allow IU networks through unchallenged

  # Always let '/concern/<id>/manifest' go unchallenged or embedded content breaks
  - pattern: ~manifest
    action: pass

  # Always let '/catalog/<id>/iiif_search' go unchallenged or search within the UV breaks.
  - pattern: ~iiif_search
    action: pass

  # Since we are carving out specific patterns from within /catalog in previous rules,
  # we can assume that anything else should be challenged.
  - pattern: ~^/catalog
    local: no  # Setting to "no" means do NOT challenge IU networks
    action: check

  # Unfortunately, we need to challenge on the routes to works and file_sets because
  # unfriendly bots already learned their URLs.
  - pattern: ~^/concern
    local: no  # Setting to "no" means do NOT challenge IU networks
    action: check

  # ========================================
  # Rules that always apply
  # ========================================

  # don't mess with obvious support files
  - pattern: ~\.(jpg|png|gif|webm|js|css|svg|pdf|woff)$
    action: pass
  
  # allow search engines in
  - pattern: ~.
    search_engine: yes
    action: pass

  # non-search engine crawlers need to go away
  - pattern: ~.
    search_engine: no
    crawler: yes
    action: deny
