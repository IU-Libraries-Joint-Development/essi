[supervisord]
nodaemon=true

[program:puma]
directory=/app
command=bundle exec puma -b tcp://0.0.0.0:3000
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:turnstile]
command=/app/turnstile-proxy/bin/turnstile_start
autorestart=false
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
